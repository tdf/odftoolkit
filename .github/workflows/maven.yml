# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package -Ppedantic --file pom.xml

  #
  # Static analysis with SonarQube Cloud (formerly SonarCloud)
  # Organisation and server URL are configured in the root pom.xml.
  #
  sonarcloud:
    name: SonarCloud
    needs: build
    runs-on: ubuntu-latest
    # The analysis token is a repository secret of tdf/odftoolkit and is therefore
    # not readable by workflow runs of forks. Analyse pushes to the main branch of
    # the upstream repository and pull requests coming from a branch of that very
    # same repository; pull requests from forks are skipped.
    if: >
      github.repository == 'tdf/odftoolkit' &&
      ((github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # shallow clones should be disabled for a better relevancy of the analysis
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Build and analyze
        env:
          # required by the scanner to pick up the pull request context, if any
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar
          -Dsonar.projectKey=tdf_odftoolkit
